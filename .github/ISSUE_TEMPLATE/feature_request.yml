name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        How should it work? Remember the architecture rules: new capabilities usually mean a
        new port implementation or a new Guardrail, not changes to domain contracts.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - guardrails-core
        - guardrails-audit
        - guardrails-authz
        - guardrails-injection-guard
        - guardrails-ratelimit
        - spring-boot-starter
        - new module
    validations:
      required: true
