name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions: {}

jobs:
  verify:
    name: Build & Verify (JDK 25)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage comment on PRs
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: SonarCloud needs it for accurate new-code detection and blame
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # ubuntu-latest ships Docker, required by the Testcontainers suites
      # (audit & ratelimit JDBC adapters run against a real PostgreSQL).
      - name: Verify
        run: mvn -B -ntp verify

      # Skipped automatically on forks/Dependabot where the secret is unavailable.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: mvn -B -ntp sonar:sonar

      - name: Add coverage report to PR
        if: github.event_name == 'pull_request'
        uses: Madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: "**/target/site/jacoco/jacoco.xml"
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage report
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          pass-emoji: ":white_check_mark:"
          fail-emoji: ":x:"

      - name: Upload Jacoco reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "*/target/site/jacoco/"
          retention-days: 7
