name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set project version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Verify and publish
        run: mvn -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          # maven-gpg-plugin (bestPractices) reads the passphrase from this exact variable
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Runs after the bundle is validated by Maven Central (publication continues
      # asynchronously via autoPublish). Extracts this version's section from
      # CHANGELOG.md as the release notes; skips if the release exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping."
            exit 0
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION; using generated notes." > /tmp/release-notes.md
          fi
          {
            echo ""
            echo "**Maven Central:**"
            echo '```xml'
            echo "<dependency>"
            echo "  <groupId>io.github.tikyparkinson</groupId>"
            echo "  <artifactId>mcp-guardrails-spring-boot-starter</artifactId>"
            echo "  <version>$VERSION</version>"
            echo "</dependency>"
            echo '```'
          } >> /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md

  prepare-next-development:
    name: Prepare next development iteration
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compute next snapshot version
        id: next
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT="${MAJOR}.$((MINOR + 1)).0"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Released $VERSION -> developing ${NEXT}-SNAPSHOT"

      - name: Bump poms to next snapshot
        run: mvn -B -ntp versions:set -DnewVersion="${{ steps.next.outputs.version }}-SNAPSHOT" -DgenerateBackupPoms=false

      - name: Create sync branch and pull request to develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT="${{ steps.next.outputs.version }}"
          BRANCH="automated/sync-main-to-develop-${NEXT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore: start ${NEXT}-SNAPSHOT development"
          git push -u origin "$BRANCH"
          {
            printf 'Automated after releasing `%s`: merges the release state of `main` back into `develop` and bumps every pom to `%s-SNAPSHOT` for the next development iteration.\n\n' "$GITHUB_REF_NAME" "$NEXT"
            printf '> Note: CI does not auto-run on bot-created pull requests — close and reopen this PR (or push any commit) to trigger the required checks before merging.\n'
          } > /tmp/pr-body.md
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --head "$BRANCH" \
            --title "chore: sync main to develop and start ${NEXT}-SNAPSHOT" \
            --body-file /tmp/pr-body.md
