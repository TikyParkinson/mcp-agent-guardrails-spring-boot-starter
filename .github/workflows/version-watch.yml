name: Version watch

# ARCHITECTURE.md §2: "siempre la última GA". Weekly check for newer GA releases of the
# managed dependencies/plugins; opens (or updates) an issue when something is outdated.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-updates:
    name: Check for newer GA versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Scan for dependency and plugin updates
        run: |
          mvn -B -ntp -Dmaven.version.ignore='.*-(M\d+|RC\d+|alpha.*|beta.*|SNAPSHOT)' \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:display-dependency-updates \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:display-plugin-updates \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:display-property-updates \
            | tee /tmp/updates.log
          rg '->' /tmp/updates.log | sort -u > /tmp/outdated.txt || true

      - name: Open or update issue when outdated
        if: hashFiles('/tmp/outdated.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/outdated.txt ]; then
            echo "Everything on latest GA."
            exit 0
          fi
          TITLE="chore: newer GA versions available"
          BODY=$(printf 'Weekly GA watch (ARCHITECTURE.md §2) found updates:\n\n```\n%s\n```\n' "$(cat /tmp/outdated.txt)")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label dependencies
          fi
